{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Django Basics</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"></script>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container mt-10">
      <h1>Employee List</h1>
      <table class="table">
        <thead>
          <tr>
            <th scope="col">#</th>
            <th scope="col">Full Name</th>
            <th scope="col">Designation</th>
            <th scope="col">Phone Number</th>
          </tr>
        </thead>
        <tbody>
          {% for emp in employees %}
          <tr>
            <th>{{ forloop.counter }}</th>
            <td>
              <a href="{% url 'employee_detail' emp.id %}"
                >{{ emp.first_name }} {{ emp.last_name }}</a
              >
            </td>
            <td>{{ emp.designation }}</td>
            <td>{{ emp.phone_no }}</td>
          </tr>
          {% endfor %}
        </tbody>
      </table>
      <!-- <img src="{% static 'images/backend-developer.webp' %}" alt="" /> -->
    </div>
    <!-- {% for emp in employees %}
      <h3>{{ emp }}</h3>
    {% endfor %} -->
  </body>
</html>
