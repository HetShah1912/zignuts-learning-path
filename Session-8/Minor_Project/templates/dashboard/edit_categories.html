{% extends '../base/base.html' %} 
{% block content %}
<div class="row">
  <!-- left sidebar -->
  {% include './left_sidebar.html' %}
  {% load crispy_forms_tags %}
  <!-- right sidebar -->
  <div class="col-md-9">
    <h3 class="mb-4">Edit Category</h3>
    <form action="{% url 'edit_categories' category.id %}" method="POST" style="width: 500px;">
      {% csrf_token %}
      {{ form | crispy }}
      <button type="submit" class="btn btn-warning">Add</button>
    </form>
  </div>
</div>
{% endblock %}
