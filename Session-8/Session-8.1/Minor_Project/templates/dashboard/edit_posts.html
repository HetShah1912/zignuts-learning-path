{% extends '../base/base.html' %} 
{% load crispy_forms_tags %} 
{% block content%}
<div class="row">
  <!-- left sidebar -->
  {% include './left_sidebar.html' %}
  <!-- right sidebar -->
  <div class="col-md-9">
    <h3 class="mb-4">Edit Post</h3>
    <form
      action="{% url 'edit_posts' post.id %}"
      method="POST"
      style="width: 500px"
      enctype="multipart/form-data">
      {% csrf_token %} 
      {{ form | crispy }}
      <button type="submit" class="btn btn-warning">Update Post</button>
    </form>
  </div>
</div>
{% endblock %}
