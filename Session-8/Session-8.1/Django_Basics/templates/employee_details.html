{% load static %}
<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Django Basics</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/css/bootstrap.min.css"
      rel="stylesheet"
      integrity="sha384-B/GM4XqrwHnWXNOWMbloTmrYXZg10cakYGmpfsR/bbzQ6JAJI4ihuyADKLnBgrCe"
      crossorigin="anonymous" />
    <script
      type="module"
      src="https://cdn.jsdelivr.net/npm/bootstrap@6.0.0-alpha.1/dist/js/bootstrap.bundle.min.js"
      integrity="sha384-1a/pXj49ZQ1aHEmrJ+gMw1otqoVsYwlEnlD8mIfY2TV03r20Y0CN7uqx1tQogjPL"
      crossorigin="anonymous"></script>

    <link rel="stylesheet" href="{% static 'css/style.css' %}" />
  </head>
  <body>
    <div class="container pt-5">
      <section class="card mx-auto" style="max-width: 320px">
        <img src="{{ employee.photo.url }}" class="card-img-top" alt="Employee Photo" />
        <div class="card-body">
          <p class="card-text m-0">
            {{ employee.first_name }} {{ employee.last_name }} 
          </p>
          <p class="card-text m-0">{{ employee.designation }}</p>
          <p class="card-text m-0">{{ employee.email_address }}</p>
          <p class="card-text m-0">{{ employee.phone_no }}</p>
        </div>
         <a href="{% url 'home' %}" class="btn btn-primary">Back to Home</a>
      </section>
     
    </div>
  </body>
</html>
