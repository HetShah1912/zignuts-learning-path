<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>TaskPro | Dashboard</title>
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
      rel="stylesheet" />
  </head>
  <body class="bg-light">
    <nav class="navbar navbar-dark bg-primary">
      <div class="container">
        <a class="navbar-brand fw-bold" href="#">TaskPro</a>
        <button id="logoutBtn" class="btn btn-outline-light btn-sm">
          Logout
        </button>
      </div>
    </nav>
    <main class="container py-4">
      <div class="d-flex justify-content-between align-items-center mb-4">
        <div>
          <h2>My Tasks</h2>
          <p class="text-secondary mb-0">
            Organize your work, one task at a time.
          </p>
        </div>
        <button class="btn btn-primary" id="addTaskBtn">+ Add Task</button>
      </div>
      <div id="message"></div>
      <div class="row g-2 mb-3">
        <div class="col-md-5">
          <input
            type="search"
            id="searchInput"
            class="form-control"
            placeholder="Search by title..." />
        </div>
        <div class="col-md-3">
          <select id="statusFilter" class="form-select">
            <option value="">All statuses</option>
            <option value="pending">Pending</option>
            <option value="completed">Completed</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="priorityFilter" class="form-select">
            <option value="">All priorities</option>
            <option value="high">High</option>
            <option value="medium">Medium</option>
            <option value="low">Low</option>
          </select>
        </div>
        <div class="col-md-2">
          <select id="sortOrder" class="form-select">
            <option value="due_date">Due date ↑</option>
            <option value="-due_date">Due date ↓</option>
          </select>
        </div>
      </div>
      <div id="taskList" class="row g-3"></div>
    </main>
    <div class="modal fade" id="taskModal" tabindex="-1" aria-hidden="true">
      <div class="modal-dialog">
        <div class="modal-content">
          <form id="taskForm">
            <div class="modal-header">
              <h5 class="modal-title" id="modalTitle">Add Task</h5>
              <button
                type="button"
                class="btn-close"
                data-bs-dismiss="modal"
                aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <input type="hidden" id="taskId" />
              <div class="mb-3">
                <label for="title" class="form-label">Title</label>
                <input
                  id="title"
                  class="form-control"
                  maxlength="200"
                  required />
              </div>
              <div class="mb-3">
                <label for="description" class="form-label">Description</label>
                <textarea
                  id="description"
                  class="form-control"
                  rows="3"></textarea>
              </div>
              <div class="mb-3">
                <label for="priority" class="form-label">Priority</label>
                <select id="priority" class="form-select" required>
                  <option value="low">Low</option>
                  <option value="medium" selected>Medium</option>
                  <option value="high">High</option>
                </select>
              </div>
              <div class="mb-3">
                <label for="due_date" class="form-label">Due date</label>
                <input
                  type="date"
                  id="due_date"
                  class="form-control"
                  required />
              </div>
              <div id="formError" class="text-danger small"></div>
            </div>
            <div class="modal-footer">
              <button
                type="button"
                class="btn btn-secondary"
                data-bs-dismiss="modal">
                Cancel
              </button>
              <button type="submit" class="btn btn-primary">Save Task</button>
            </div>
          </form>
        </div>
      </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
    <script src="js/tasks.js"></script>
  </body>
</html>
