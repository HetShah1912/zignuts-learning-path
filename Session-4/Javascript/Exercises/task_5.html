<!-- Task 5: Write a program to print the Fibonacci series. Take the number of steps from the input using HTML Input, and when you click on the Print button, using JS, print the
entered number of steps in the Fibonacci series on the HTML page. -->

<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Fibonacci Series</title>
    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
      }
      body {
        min-height: 100vh;
        display: flex;
        flex-direction: column;
        justify-content: center;
        align-items: center;
        font-family: Arial, sans-serif;
        background: linear-gradient(135deg, #667eea, #764ba2);
      }
      .container {
        width: 420px;
        padding: 35px;
        background-color: white;
        border-radius: 18px;
        box-shadow: 0 15px 35px rgba(0, 0, 0, 0.2);
      }
      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #171719;
        font-size: 28px;
        padding: 20px;
        background-color: #e4d3d3;
        border-radius: 30px;
        border: 2px solid rgb(15, 14, 14);
      }
      label {
        font-size: 20px;
        font-weight: bold;
        color: #f5f6f1;
      }
      input {
        padding: 12px 14px;
        border: 2px solid #ddd;
        border-radius: 8px;
        font-size: 16px;
        outline: none;
        transition: 0.3s;
      }
      input:focus {
        border-color: #667eea;
        box-shadow: 0 0 0 3px rgba(102, 126, 234, 0.15);
      }
      button {
        width: 15%;
        margin-top: 20px;
        padding: 13px;
        border: none;
        border-radius: 8px;
        background-color: #667eea;
        color: white;
        font-size: 16px;
        font-weight: bold;
        cursor: pointer;
        transition: 0.3s;
      }
      button:hover {
        background-color: #5568d8;
        transform: translateY(-2px);
      }
      button:active {
        transform: translateY(0);
      }
      #resultArea {
        margin-top: 25px;
        padding: 15px;
        min-height: 60px;
        background-color: #f5f6ff;
        border-radius: 10px;
        color: #333;
        font-size: 18px;
        line-height: 1.8;
        text-align: center;
      }
    </style>
  </head>
  <body>
    <h1>Fibonacci Series</h1>
    <hr>
    <div>
      <label for="input">Enter Number : </label>
      <input type="number" id="input" placeholder="Enter a Positive Number"/>
    </div>
    <button id="btn">Generate Fibonacci</button>
    <div id="resultArea"></div>
    <script>
      document.getElementById("btn").addEventListener("click", () => {
        const resultArea = document.getElementById("resultArea");
        const steps = document.getElementById("input").value;
        resultArea.innerHTML = "";
        if (steps < 0) {
          resultArea.innerHTML = "Enter Valid Positive Number";
        }
        const fibo = [];
        for (let i = 0; i < steps; i++) {
          if (i === 0) {
            fibo.push(0);
          } else if (i === 1) {
            fibo.push(1);
          } else {
            fibo.push(fibo[i - 1] + fibo[i - 2]);
          }
        }
        fibo.forEach((element) => {
          resultArea.innerHTML += `${element} `;
        });
      });

  </body>
</html>
